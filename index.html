<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>🎀 Meri Wali Trends 🐱✨</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Quicksand:wght@600;700&display=swap');

    * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Plus Jakarta Sans', sans-serif; }

    :root {
      --bg-color: #fff5f8;
      --card-bg: #ffffff;
      --pink-primary: #ff4d88;
      --pink-soft: #ffe4ec;
      --pink-accent: #ff85a2;
      --text-dark: #2d1e2f;
      --text-muted: #7a6a7c;
      --border-color: #ffd1dc;
    }

    body {
      background: var(--bg-color);
      color: var(--text-dark);
      padding: 15px 12px 60px;
      text-align: center;
      min-height: 100vh;
    }

    /* Header Section */
    .header {
      padding: 16px 10px 14px;
      margin-bottom: 14px;
      background: #ffffff;
      border-radius: 20px;
      border: 1px solid var(--border-color);
      box-shadow: 0 8px 24px rgba(255, 105, 180, 0.08);
      max-width: 900px;
      margin-left: auto;
      margin-right: auto;
    }

    .brand-title {
      font-family: 'Quicksand', cursive, sans-serif;
      font-size: 23px;
      font-weight: 700;
      color: var(--pink-primary);
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 6px;
    }

    .cat-wiggle {
      display: inline-block;
      animation: catWiggle 2s infinite ease-in-out;
      transform-origin: bottom center;
    }

    @keyframes catWiggle {
      0%, 100% { transform: rotate(0deg) scale(1); }
      25% { transform: rotate(-10deg) scale(1.08); }
      75% { transform: rotate(10deg) scale(1.08); }
    }

    .brand-subtitle {
      font-size: 12.5px;
      color: var(--text-muted);
      margin-top: 5px;
      font-weight: 600;
    }

    /* Voice Note Cute Banner */
    .voice-banner-wrapper {
      max-width: 900px;
      margin: 0 auto 16px;
    }

    .voice-btn {
      background: linear-gradient(135deg, #ff6584, #ff2e63);
      color: #fff;
      border: none;
      padding: 11px 18px;
      border-radius: 999px;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      box-shadow: 0 6px 16px rgba(255, 46, 99, 0.35);
      transition: transform 0.2s, box-shadow 0.2s;
      animation: pulseBtn 2.2s infinite;
    }

    .voice-btn:hover {
      transform: scale(1.03);
      box-shadow: 0 8px 20px rgba(255, 46, 99, 0.45);
    }

    @keyframes pulseBtn {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.04); }
    }

    .voice-popup {
      display: none;
      background: #fff;
      border: 2px dashed var(--pink-primary);
      border-radius: 16px;
      padding: 12px 16px;
      margin-top: 10px;
      font-size: 13px;
      color: #b01a48;
      font-weight: 600;
      box-shadow: 0 6px 18px rgba(255, 77, 136, 0.12);
      line-height: 1.4;
      animation: fadeIn 0.3s ease-out;
    }

    /* Filter Tabs Bar */
    .filter-bar {
      display: flex;
      justify-content: center;
      gap: 8px;
      margin: 0 auto 20px;
      max-width: 500px;
      padding: 4px;
      background: #ffffff;
      border-radius: 999px;
      border: 1px solid var(--border-color);
    }

    .filter-tab {
      flex: 1;
      padding: 9px 14px;
      border-radius: 999px;
      border: none;
      background: transparent;
      color: var(--text-muted);
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .filter-tab.active {
      background: var(--pink-primary);
      color: #ffffff;
      box-shadow: 0 4px 12px rgba(255, 77, 136, 0.35);
    }

    /* Product Grid */
    .grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 12px;
      max-width: 900px;
      margin: 0 auto;
    }

    .card {
      background: var(--card-bg);
      border-radius: 16px;
      overflow: hidden;
      border: 1px solid var(--border-color);
      cursor: pointer;
      text-align: left;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      transition: transform 0.2s, box-shadow 0.2s;
      box-shadow: 0 4px 12px rgba(255, 105, 180, 0.05);
      user-select: none;
    }

    .card:hover {
      transform: translateY(-3px);
      box-shadow: 0 8px 20px rgba(255, 77, 136, 0.18);
    }

    .card-img-wrapper {
      width: 100%;
      aspect-ratio: 1 / 1;
      overflow: hidden;
      background: #fdf7f9;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .card-img-wrapper img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .card-info {
      padding: 10px 10px 12px;
    }

    .card-info h3 {
      font-size: 12.5px;
      margin-bottom: 4px;
      color: var(--text-dark);
      font-weight: 700;
      line-height: 1.35;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
      min-height: 34px;
    }

    .card-info .price {
      color: var(--pink-primary);
      font-weight: 800;
      font-size: 14px;
      margin-bottom: 8px;
    }

    .btn-view {
      display: block;
      text-align: center;
      background: var(--pink-soft);
      color: var(--pink-primary);
      padding: 8px 6px;
      border-radius: 8px;
      font-size: 11.5px;
      font-weight: 700;
      transition: 0.2s;
      border: 1px solid rgba(255, 77, 136, 0.2);
    }

    .card:hover .btn-view {
      background: var(--pink-primary);
      color: #fff;
    }

    /* Modal Base */
    .modal {
      display: none;
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      background: rgba(45, 30, 47, 0.65);
      backdrop-filter: blur(6px);
      justify-content: center;
      align-items: center;
      padding: 12px;
      z-index: 1000;
      animation: fadeIn 0.2s ease-out;
    }

    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    .modal-content {
      background: #ffffff;
      border-radius: 22px;
      max-width: 410px;
      width: 100%;
      border: 1px solid var(--border-color);
      overflow: hidden;
      position: relative;
      box-shadow: 0 20px 45px rgba(255, 77, 136, 0.2);
      max-height: 92vh;
      overflow-y: auto;
    }

    .close-btn {
      position: absolute;
      top: 12px;
      right: 12px;
      font-size: 18px;
      color: var(--text-dark);
      cursor: pointer;
      background: #fff;
      width: 32px;
      height: 32px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 10;
      border: 1px solid var(--border-color);
      box-shadow: 0 4px 10px rgba(0,0,0,0.08);
      font-weight: bold;
    }

    .modal-img-container {
      width: 100%;
      background: #fdf7f9;
      display: flex;
      align-items: center;
      justify-content: center;
      border-bottom: 1px solid var(--border-color);
    }

    .modal-img {
      width: 100%;
      height: auto;
      max-height: 380px;
      object-fit: contain;
      display: block;
    }

    .modal-body {
      padding: 18px;
      text-align: left;
    }

    .modal-title {
      font-size: 16px;
      font-weight: 700;
      color: var(--text-dark);
      margin-bottom: 4px;
      line-height: 1.35;
    }

    .modal-price {
      font-size: 19px;
      color: var(--pink-primary);
      font-weight: 800;
      margin-bottom: 12px;
    }

    .modal-desc {
      font-size: 12.5px;
      color: var(--text-muted);
      line-height: 1.55;
      margin-bottom: 18px;
      background: #fff9fb;
      padding: 12px;
      border-radius: 12px;
      border: 1px solid var(--pink-soft);
    }

    .btn-order-now {
      display: block;
      width: 100%;
      padding: 14px;
      background: linear-gradient(135deg, #ff4d88, #ff2a6d);
      color: #fff;
      font-weight: 700;
      border-radius: 12px;
      border: none;
      cursor: pointer;
      font-size: 14px;
      box-shadow: 0 6px 16px rgba(255, 42, 109, 0.3);
    }

    /* Modal 2: Form */
    .form-modal-body {
      padding: 22px 18px;
      text-align: left;
    }

    .mini-product-card {
      display: flex;
      align-items: center;
      gap: 12px;
      background: #fff9fb;
      padding: 10px;
      border-radius: 12px;
      margin-bottom: 14px;
      border: 1px solid var(--border-color);
    }

    .mini-product-card img {
      width: 58px;
      height: 58px;
      border-radius: 10px;
      object-fit: cover;
      background: #fff;
    }

    .qty-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #fff9fb;
      padding: 10px 14px;
      border-radius: 12px;
      margin-bottom: 14px;
      border: 1px solid var(--border-color);
    }

    .qty-btn {
      width: 32px;
      height: 32px;
      background: #ffffff;
      border: 1px solid var(--pink-accent);
      color: var(--pink-primary);
      border-radius: 8px;
      font-weight: 700;
      cursor: pointer;
      font-size: 16px;
    }

    .form-group {
      margin-bottom: 12px;
    }

    .form-group label {
      font-size: 11.5px;
      font-weight: 700;
      color: var(--text-muted);
      display: block;
      margin-bottom: 5px;
    }

    .form-group input, .form-group textarea {
      width: 100%;
      padding: 10px 12px;
      background: #fff;
      color: var(--text-dark);
      border: 1px solid var(--border-color);
      border-radius: 10px;
      font-size: 13px;
      outline: none;
    }

    .form-group input:focus, .form-group textarea:focus {
      border-color: var(--pink-primary);
      box-shadow: 0 0 0 3px rgba(255, 77, 136, 0.15);
    }

    .btn-submit-wa {

      padding: 14px;
      background: #25d366;
      color: #fff;
      border: none;
      border-radius: 12px;
      font-weight: 700;
      cursor: pointer;
      margin-top: 10px;
      font-size: 14px;
      box-shadow: 0 6px 16px rgba(37, 211, 102, 0.3);
    }
  </style>
</head>

        <div class="qty-row">

            <span id="qtyVal" style="font-weight: 800; min-width: 24px;">1</span>
            <button class="qty-btn" onclick="updateQty(1)">+</button>
          </div>
        </div>
        <div class="form-group"><label>Full Name *</label><input type="text" id="custName" placeholder="Enter full name"></div>
        <div class="form-group"><label>Mobile Number *</label><input type="tel" id="custPhone" placeholder="10-digit mobile number"></div>
        <div class="form-group"><label>Delivery Address *</label><textarea id="custAddress" rows="2" placeholder="House no, Area, City"></textarea></div>
        <div class="form-group"><label>Pincode *</label><input type="text" id="custPincode" placeholder="6-digit pincode"></div>

      </div>
    </div>

      24: { category: "dresses", code: "WD-104", title: "Embroidered Semi-Stitched Lehenga Choli", priceNum: 899, price: "₹899", img: "https://i.ibb.co/DPsmtDdc/IMG-20260817-124016.jpg", desc: "• Work: Dori & Sequins Heavy Embroidery<br>• Fabric: Art Silk Lehenga with Choli<br>• Dupatta: Soft Net Embroidered Dupatta<br>• Type: Semi-Stitched (Fits up to 42 bust)" },

    };

    function render() {
      const grid = document.getElementById('productGrid');
      grid.innerHTML = '';
      
      let count = 0;
      for (let id in products) {
        const item = products[id];
        if (currentFilter === 'all' || item.category === currentFilter) {
          count++;
          grid.innerHTML += `
            <div class="card" onclick="openModal(${id})">
              <div class="card-img-wrapper">
                <img src="${item.img}" alt="${item.title}" loading="lazy">
              </div>
              <div class="card-info">
                <h3>${item.title}</h3>
                <div class="price">${item.price}</div>
                <span class="btn-view">View Details</span>
              </div>
            </div>`;
        }
      }

      if (count === 0) {
        grid.innerHTML = `<div style="grid-column: span 2; padding: 40px 10px; color: var(--text-muted); font-size: 14px;">No products found in this category yet! 🎀</div>`;
      }
    }

    function filterCategory(cat, btn) {
      currentFilter = cat;
      document.querySelectorAll('.filter-tab').forEach(t => t.classList.remove('active'));
      btn.classList.add('active');
      render();
    }

    function openModal(id) {
      currentId = id;
      const p = products[id];
      document.getElementById('mImg').src = p.img;
      document.getElementById('mTitle').innerText = p.title;
      document.getElementById('mPrice').innerText = p.price;
      document.getElementById('mDesc').innerHTML = p.desc;
      document.getElementById('productModal').style.display = 'flex';
    }

    function openForm() {
      document.getElementById('productModal').style.display = 'none';
      document.getElementById('orderFormModal').style.display = 'flex';
      const p = products[currentId];
      selectedQuantity = 1;
      document.getElementById('qtyVal').innerText = selectedQuantity;
      document.getElementById('miniImg').src = p.img;
      document.getElementById('miniTitle').innerText = p.title;
      document.getElementById('miniPriceUnit').innerText = p.price;
    }

    function updateQty(delta) {
      selectedQuantity = Math.max(1, Math.min(20, selectedQuantity + delta));
      document.getElementById('qtyVal').innerText = selectedQuantity;
    }

    function submitOrder() {
      const p = products[currentId];
      const name = document.getElementById('custName').value.trim();
      const phone = document.getElementById('custPhone').value.trim();
      const address = document.getElementById('custAddress').value.trim();
      const pin = document.getElementById('custPincode').value.trim();

      if (!name || !phone || !address || !pin) {
        alert("Please fill all required details! 🌸");
        return;
      }

      const total = p.priceNum * selectedQuantity;
      const msg = 
        `*NEW ORDER PLACED*\n\n` +
        `*Store:* 🎀 Meri Wali Trends 🐱✨\n` +
        `*Product Code:* ${p.code}\n` +
        `*Item:* ${p.title}\n` +
        `*Unit Price:* ${p.price}\n` +
        `*Quantity:* ${selectedQuantity}\n` +
        `*Total Amount:* ₹${total}\n` +
        `*Product Photo:* ${p.img}\n\n` +
        `*Customer Details:*\n` +
        `• *Name:* ${name}\n` +
        `• *Phone:* ${phone}\n` +
        `• *Delivery Address:* ${address}\n` +
        `• *Pincode:* ${pin}\n\n` +
        `Please confirm my order & send delivery details.`;

      window.open(`https://wa.me/${whatsappNum}?text=${encodeURIComponent(msg)}`, '_blank');
      document.getElementById('orderFormModal').style.display = 'none';
    }

    render();
  </script>
</body>
</html>
